[build-system]
requires = [
    "setuptools>=64.0",
]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Limespy" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE.txt",
]
name = "build-py"
requires-python = ">=3.10"
readme = "README.md"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/lime-actions/build-py"
Changelog = "https://github.com/lime-actions/build-py/blob/main/README.md#Changelog"
"Issue Tracker" = "https://github.com/lime-actions/build-py/issues"

[dependency-groups]
dev = [
    "pre-commit >= 3.2.2,<4",
    { include-group = "build" },
]
build = [
    "limedev[package]",
]
